ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Traefik terminates TLS. The app only sets Secure session cookies when HTTPS is on.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

PassEnv ARISE_APP_ENV ARISE_DB_HOST ARISE_DB_NAME ARISE_DB_USER ARISE_DB_PASS ARISE_DB_PORT ARISE_DB_SOCKET
