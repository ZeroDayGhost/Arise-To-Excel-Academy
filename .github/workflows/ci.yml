name: CI

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: sch
  SERVER_PATH: /opt/projects/sch.oleq.app

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Copy config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'Makefile,docker-compose.yml,arise_to_excel.sql'
          target: ${{ env.SERVER_PATH }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ACTOR: ${{ github.actor }}
          GIT_SHA: ${{ github.sha }}
          SERVER_PATH: ${{ env.SERVER_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: GHCR_PAT,ACTOR,GIT_SHA,SERVER_PATH
          script: |
            set -euo pipefail
            cd "$SERVER_PATH"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$ACTOR" --password-stdin
            # Do not export TAG. Make treats an exported TAG as the image tag,
            # and we only publish the 7-character tag.
            SHORT_TAG=$(printf '%s' "$GIT_SHA" | cut -c1-7)
            unset TAG || true
            echo "Deploying sch:${SHORT_TAG}"
            flock -w 600 /tmp/sch-deploy.lock \
              env -u TAG make deploy TAG="$SHORT_TAG"
